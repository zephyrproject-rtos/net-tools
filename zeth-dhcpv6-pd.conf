# Configuration file for net-setup.sh to create the two host TAP interfaces
# used by the Zephyr dhcpv6_pd sample (IPv6 prefix delegation, RFC 8415).
#
# The requesting-router build of the sample uses two interfaces:
#   zeth0 - upstream (WAN) link, runs the DHCPv6 client (IA_NA + IA_PD),
#   zeth1 - downstream (LAN) link, advertises the delegated /64 via RAs.
#
# Start the interfaces with (note the "zeth0" interface name, the native TAP
# driver names its interfaces zeth0, zeth1, ...):
#
#   ./net-setup.sh --config zeth-dhcpv6-pd.conf --iface zeth0
#
# On the WAN link (zeth0) a DHCPv6-PD server has to answer the client, e.g.
# the dhcpv6_pd sample built with overlay-server.conf running on another
# native_sim instance, or a host DHCPv6 server. The host address configured
# here on zeth0 can be used to run such a server on the host.
#
# On the LAN link (zeth1) the host end is left to autoconfigure from the
# Router Advertisements sent by the Zephyr requesting router, so that the
# delegated prefix can be observed with SLAAC.

# net-setup.sh already created the primary interface and passes its name here.
INTERFACE0="$1"

# Derive the downstream interface name (zeth0 -> zeth1).
INTERFACE1=$(echo "${INTERFACE0}" | sed "s/0\$/1/")

HWADDR0="00:00:5e:00:53:00"
HWADDR1="00:00:5e:00:53:01"

# Upstream (WAN) link addressing. Use a /64 so the on-link route for
# 2001:db8::/64 is created automatically (a bare address defaults to /128).
IPV6_ADDR0="2001:db8::2/64"

# Configure the upstream interface (already created by net-setup.sh).
ip link set dev "${INTERFACE0}" up
ip link set dev "${INTERFACE0}" address "${HWADDR0}"
ip -6 address add "${IPV6_ADDR0}" dev "${INTERFACE0}" nodad

# Create and bring up the downstream interface. No static address is assigned:
# the host end autoconfigures from the delegated prefix advertised by Zephyr.
ip tuntap add "${INTERFACE1}" mode tap 2>/dev/null
ip link set dev "${INTERFACE1}" up
ip link set dev "${INTERFACE1}" address "${HWADDR1}"

# Accept Router Advertisements on the downstream link even though forwarding
# may be enabled on the host, so the delegated /64 can be autoconfigured.
sysctl -w "net.ipv6.conf.${INTERFACE1}.accept_ra=2" >/dev/null 2>&1
sysctl -w "net.ipv6.conf.${INTERFACE1}.forwarding=0" >/dev/null 2>&1
