# Runtime configuration for the MLD listener conformance suite.
#
# The addresses below are the defaults that tests/net/conformance/mld is built
# with. The interface is the one with no address on the Linux side, so that
# nothing but the tester answers on it.

[MODULE_PARAMETERS]
Zephyr_SUT.tsp_sut_ipv6 := "2001:db8::1"
Zephyr_SUT.tsp_tester_ipv6 := "2001:db8::2"
# The application joins for six seconds and stays out for four, so the next
# join or leave is never more than ten seconds away.
Zephyr_SUT.tsp_response_timeout := 15.0
Zephyr_SUT.tsp_silence_timeout := 2.0

MLD_Suite.tsp_tester_mac := "020000000002"
MLD_Suite.tsp_tester_linklocal := "fe80::2"
MLD_Suite.tsp_group := "ff05::db8:1"
MLD_Suite.tsp_other_group := "ff05::db8:99"
MLD_Suite.tsp_joined_for := 6.0
MLD_Suite.tsp_robustness := 2

[TESTPORT_PARAMETERS]
# The port opens the interface when the port is mapped, so it reads all of
# this for itself before any test code runs. Only IPv6 reaches the tests:
# everything MLD sends goes to a multicast address, so there is no address
# resolution to answer on this link.
system.pt.interface := "zethL2"
system.pt.source_address := "020000000002"
system.pt.ethertype := "86DD"

[LOGGING]
LogFile := "mld-%e.%s"
FileMask := LOG_ALL
ConsoleMask := TTCN_ERROR | TTCN_WARNING | TTCN_TESTCASE | TTCN_STATISTICS | USER
LogSourceInfo := Yes
TimeStampFormat := Time

[EXECUTE]
MLD_Suite.control
