// ISC Kea DHCPv6 server configuration for testing the Zephyr dhcpv6_pd
// sample (IPv6 prefix delegation, RFC 8415).
//
// This runs on the host and acts as the delegating router on the upstream
// (WAN) link zeth0. It hands out:
//   - an IA_NA address from 2001:db8::/64 (the WAN link subnet), and
//   - an IA_PD delegated prefix (a /56 carved from 2001:db8:beef::/48).
//
// The Zephyr requesting router installs the IA_NA address on its upstream
// interface and then carves /64 sub-prefixes out of the delegated /56 for
// each downstream interface, advertising them via Router Advertisements.
//
// dnsmasq is NOT usable here: its "prefix delegation" support only lets it
// serve addresses from a prefix the host already received, it cannot act as
// a delegating router that answers IA_PD requests.
//
// Prerequisites:
//   - Install Kea (Debian/Ubuntu: apt install kea-dhcp6-server; Fedora:
//     dnf install kea; or build from isc.org).
//   - Bring up the host interfaces first:
//       ./net-setup.sh --config zeth-dhcpv6-pd.conf --iface zeth0
//
// On Debian/Ubuntu, kea-dhcp6 ships with an enforced AppArmor profile written
// for its systemd unit; running it by hand fails to create its PID/lockfile
// ("Permission denied" on /run/kea/... even as root). Put the profile in
// complain mode first (once per boot / until re-enforced):
//   sudo aa-complain /usr/sbin/kea-dhcp6   # from the apparmor-utils package
// then run the server (as root, in the foreground):
//   sudo kea-dhcp6 -c kea-dhcp6-pd.conf
// Restore enforcement afterwards with: sudo aa-enforce /usr/sbin/kea-dhcp6
//
// Then start the Zephyr dhcpv6_pd sample (requesting-router build) attached
// to zeth0/zeth1.

{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [ "zeth0" ],

      // Fail loudly (and retry) if the zeth0 socket cannot be opened, instead
      // of silently running without listening. This catches the common
      // mistake of starting Kea before zeth0 exists / is up: Kea opens its
      // sockets and joins the DHCPv6 multicast group (ff02::1:2) only once at
      // startup, so it must be started *after* the interfaces are up.
      "service-sockets-require-all": true,
      "service-sockets-max-retries": 5,
      "service-sockets-retry-wait-time": 5000
    },

    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases6.csv"
    },

    "renew-timer": 1000,
    "rebind-timer": 2000,
    "preferred-lifetime": 3000,
    "valid-lifetime": 4000,

    "subnet6": [
      {
        "id": 1,
        "subnet": "2001:db8::/64",
        "interface": "zeth0",

        "pools": [
          { "pool": "2001:db8::100 - 2001:db8::1ff" }
        ],

        "pd-pools": [
          {
            "prefix": "2001:db8:beef::",
            "prefix-len": 48,
            "delegated-len": 56
          }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [
          { "output": "stdout" }
        ],
        "severity": "INFO",
        "debuglevel": 0
      }
    ]
  }
}
